<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Transparent placeholder. src/favicon.js replaces this with the Kong walk
         cycle as soon as the frames are rasterised; pointing it at a real image
         in the meantime just flashes a different icon for a moment. -->
    <link
      rel="icon"
      type="image/png"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII="
    />
    <title>Primates</title>

    <!--
      Identity metadata. Wallets and link-preview crawlers both read this, and a
      site that declares nothing about itself is the shape that automated
      scanners treat as suspicious. It is also what makes a shared link render
      as a card rather than a bare URL.

      This on its own does not clear Phantom's warning — that comes from their
      domain review — but an unfurnished page is a signal, and this removes it.
    -->
    <meta
      name="description"
      content="Three tiers of desk pass, each owning a vault that fills with tokenised real-world assets. Only the holder can spend from it, and it transfers with the NFT."
    />
    <link rel="canonical" href="https://primates.app/" />
    <meta name="theme-color" content="#0b0b0b" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Primates" />
    <meta property="og:url" content="https://primates.app/" />
    <meta property="og:title" content="Primates — Monkey Business Done On-Chain" />
    <meta
      property="og:description"
      content="Mint a desk, own the vault. Protocol revenue buys tokenised stocks on a rotation and splits them across desks by tier weight."
    />
    <meta property="og:image" content="https://primates.app/changelog_introducing_primates_app.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@primatespl" />
    <meta name="twitter:title" content="Primates — Monkey Business Done On-Chain" />
    <meta
      name="twitter:description"
      content="Mint a desk, own the vault. Protocol revenue buys tokenised stocks on a rotation and splits them across desks by tier weight."
    />
    <meta name="twitter:image" content="https://primates.app/changelog_introducing_primates_app.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
